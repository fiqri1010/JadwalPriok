<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#21264c" />
      <stop offset="50%" stopColor="#181c38" />
      <stop offset="100%" stopColor="#101326" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" floodColor="#000000" floodOpacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGradFull)" />

  <!-- Calendar Container with Shadow -->
  <g filter="url(#cardShadow)">
    <!-- Outer Calendar Card -->
    <rect x="76" y="78" width="360" height="380" rx="54" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="7" />
    
    <!-- Calendar Blue Header Bar -->
    <path d="M 80 170 L 80 132 C 80 102 104 81 134 81 L 378 81 C 408 81 432 102 432 132 L 432 170 Z" fill="#4366FA" />

    <!-- 3 Top Binder Loops -->
    <rect x="130" y="54" width="30" height="60" rx="15" fill="#242F40" stroke="#FFFFFF" stroke-width="5" />
    <rect x="241" y="54" width="30" height="60" rx="15" fill="#242F40" stroke="#FFFFFF" stroke-width="5" />
    <rect x="352" y="54" width="30" height="60" rx="15" fill="#242F40" stroke="#FFFFFF" stroke-width="5" />

    <!-- 6 Sub-header Dots -->
    <rect x="128" y="192" width="15" height="22" rx="7.5" fill="#93A4BA" />
    <rect x="177" y="192" width="15" height="22" rx="7.5" fill="#93A4BA" />
    <rect x="226" y="192" width="15" height="22" rx="7.5" fill="#93A4BA" />
    <rect x="275" y="192" width="15" height="22" rx="7.5" fill="#93A4BA" />
    <rect x="324" y="192" width="15" height="22" rx="7.5" fill="#93A4BA" />
    <rect x="371" y="192" width="15" height="22" rx="7.5" fill="#93A4BA" />

    <!-- Inner Dark Display Area -->
    <rect x="112" y="236" width="288" height="182" rx="24" fill="#121624" />

    <!-- Schedule Bars Row 1 -->
    <rect x="124" y="249" width="128" height="27" rx="13.5" fill="#2AB8FA" />
    <rect x="339" y="249" width="49" height="27" rx="13.5" fill="#F43B66" />

    <!-- Schedule Bars Row 2 -->
    <rect x="207" y="288" width="82" height="27" rx="13.5" fill="#0EBE7F" />
    <rect x="302" y="288" width="87" height="27" rx="13.5" fill="#6362FC" />

    <!-- Schedule Bars Row 3 -->
    <rect x="124" y="327" width="144" height="27" rx="13.5" fill="#FAA307" />

    <!-- Schedule Bars Row 4 -->
    <rect x="177" y="366" width="133" height="27" rx="13.5" fill="#F0388A" />
    <rect x="322" y="366" width="67" height="27" rx="13.5" fill="#05B6D5" />
  </g>
</svg>
