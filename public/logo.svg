<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Drop Shadow for Calendar Base -->
    <filter id="calShadow" x="16" y="24" width="480" height="476" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
    
    <!-- Top Blue Binder Gradient -->
    <linearGradient id="binderGrad" x1="64" y1="64" x2="448" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B6BF6" />
      <stop offset="100%" stop-color="#4D7DF9" />
    </linearGradient>

    <!-- Ring Metallic Gradient -->
    <linearGradient id="ringGrad" x1="0" y1="40" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Screen Inner Glow / Border -->
    <linearGradient id="screenBorder" x1="96" y1="216" x2="416" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
  </defs>

  <!-- Base Calendar Sheet (White with Rounded Corners & Shadow) -->
  <g filter="url(#calShadow)">
    <rect x="64" y="64" width="384" height="396" rx="68" fill="#F8FAFC" />
    <rect x="64" y="64" width="384" height="396" rx="68" fill="#FFFFFF" />
  </g>

  <!-- Top Blue Header Section (Clipped to top curves) -->
  <path d="M 64 132 C 64 94.4 94.4 64 132 64 L 380 64 C 417.6 64 448 94.4 448 132 L 448 152 L 64 152 Z" fill="url(#binderGrad)" />

  <!-- 6 Binder Perforations / Gray Dots -->
  <circle cx="120" cy="184" r="7.5" fill="#8898AA" />
  <circle cx="174" cy="184" r="7.5" fill="#8898AA" />
  <circle cx="229" cy="184" r="7.5" fill="#8898AA" />
  <circle cx="283" cy="184" r="7.5" fill="#8898AA" />
  <circle cx="338" cy="184" r="7.5" fill="#8898AA" />
  <circle cx="392" cy="184" r="7.5" fill="#8898AA" />

  <!-- 3 Top Metal Binder Rings -->
  <!-- Left Ring -->
  <rect x="120" y="44" width="28" height="58" rx="14" fill="url(#ringGrad)" stroke="#FFFFFF" stroke-width="4" />
  <!-- Center Ring -->
  <rect x="242" y="44" width="28" height="58" rx="14" fill="url(#ringGrad)" stroke="#FFFFFF" stroke-width="4" />
  <!-- Right Ring -->
  <rect x="364" y="44" width="28" height="58" rx="14" fill="url(#ringGrad)" stroke="#FFFFFF" stroke-width="4" />

  <!-- Dark Schedule Screen -->
  <rect x="96" y="216" width="320" height="196" rx="24" fill="#0C101D" stroke="#1E293B" stroke-width="1.5" />

  <!-- Colored Schedule Shift Bars / Gantt Pills -->
  <!-- Row 1 -->
  <!-- Cyan Shift Bar -->
  <rect x="116" y="238" width="128" height="26" rx="13" fill="#38BDF8" />
  <!-- Red Shift Bar -->
  <rect x="338" y="238" width="58" height="26" rx="13" fill="#F43F5E" />

  <!-- Row 2 -->
  <!-- Green Shift Bar -->
  <rect x="198" y="276" width="84" height="26" rx="13" fill="#10B981" />
  <!-- Indigo / Purple Shift Bar -->
  <rect x="294" y="276" width="86" height="26" rx="13" fill="#6366F1" />

  <!-- Row 3 -->
  <!-- Amber / Gold Shift Bar -->
  <rect x="116" y="314" width="144" height="26" rx="13" fill="#F59E0B" />

  <!-- Row 4 -->
  <!-- Rose / Pink Shift Bar -->
  <rect x="168" y="352" width="132" height="26" rx="13" fill="#EC4899" />
  <!-- Teal / Sky Blue Shift Bar -->
  <rect x="312" y="352" width="66" height="26" rx="13" fill="#06B6D4" />
</svg>
