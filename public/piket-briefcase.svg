<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A65B28"/>
      <stop offset="50%" stop-color="#8C4619"/>
      <stop offset="100%" stop-color="#6B310C"/>
    </linearGradient>
    <linearGradient id="strap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#733810"/>
      <stop offset="100%" stop-color="#4A2004"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Main Briefcase Body -->
  <rect x="5" y="20" width="90" height="55" rx="6" fill="url(#leather)" filter="url(#shadow)"/>
  <!-- Top Lid Flap seam -->
  <line x1="5" y1="32" x2="95" y2="32" stroke="#522305" stroke-width="1.5" stroke-dasharray="3 1.5"/>
  <!-- Leather Straps Left & Right -->
  <rect x="25" y="20" width="10" height="55" fill="url(#strap)"/>
  <rect x="65" y="20" width="10" height="55" fill="url(#strap)"/>
  <!-- Strap Stitching -->
  <line x1="26.5" y1="20" x2="26.5" y2="75" stroke="#D9A86C" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  <line x1="33.5" y1="20" x2="33.5" y2="75" stroke="#D9A86C" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  <line x1="66.5" y1="20" x2="66.5" y2="75" stroke="#D9A86C" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  <line x1="73.5" y1="20" x2="73.5" y2="75" stroke="#D9A86C" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  <!-- Buckles -->
  <rect x="23" y="38" width="14" height="10" rx="2" fill="none" stroke="url(#brass)" stroke-width="2.5"/>
  <rect x="28" y="36" width="4" height="14" rx="1" fill="url(#brass)"/>
  <rect x="63" y="38" width="14" height="10" rx="2" fill="none" stroke="url(#brass)" stroke-width="2.5"/>
  <rect x="68" y="36" width="4" height="14" rx="1" fill="url(#brass)"/>
  <!-- Brass Corner Guards -->
  <path d="M 5,30 L 15,20 L 5,20 Z" fill="url(#brass)"/>
  <path d="M 95,30 L 85,20 L 95,20 Z" fill="url(#brass)"/>
  <path d="M 5,65 L 15,75 L 5,75 Z" fill="url(#brass)"/>
  <path d="M 95,65 L 85,75 L 95,75 Z" fill="url(#brass)"/>
  <!-- Handle -->
  <path d="M 38,20 Q 38,8 50,8 Q 62,8 62,20" fill="none" stroke="url(#strap)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 38,20 Q 38,8 50,8 Q 62,8 62,20" fill="none" stroke="#D9A86C" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round"/>
  <!-- Handle Metal Attachments -->
  <rect x="34" y="16" width="8" height="6" rx="1" fill="url(#brass)"/>
  <rect x="58" y="16" width="8" height="6" rx="1" fill="url(#brass)"/>
</svg>